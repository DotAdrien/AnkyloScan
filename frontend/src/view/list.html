<link rel="stylesheet" href="style/work.css">

<div class="scan-container" x-init="loadList()">
    <h2 class="scan-title">False Positives List 🛡️</h2>
    
    <div class="scan-card list-add-card">
        <h3>Add host & port to ignore 🚫</h3>
        <p>Ignore all vulnerabilities from a specific host and port during the V3 expert analysis.</p>
        
        <form @submit.prevent="addWordToList()" class="form-field-work list-add-form" style="display: flex; align-items: stretch; background: #0f111a; border: 1px solid #23263b; border-radius: 8px; padding: 4px; width: 100%;">
            <div class="form-group-item list-input-group" style="flex: 2; display: flex; flex-direction: column; padding: 10px 16px; border-right: 1px solid #23263b;">
                <label for="new-host-input" style="font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 4px;">HOST (IP)</label>
                <input type="text" id="new-host-input" placeholder="e.g.: 192.168.1.10" required style="background: transparent; border: none; color: #fff; outline: none; padding: 0;">
            </div>
            
            <div class="form-group-item list-input-group" style="flex: 1; display: flex; flex-direction: column; padding: 10px 16px;">
                <label for="new-port-input" style="font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 4px;">PORT</label>
                <input type="text" id="new-port-input" placeholder="e.g.: 443" required style="background: transparent; border: none; color: #fff; outline: none; padding: 0;">
            </div>
            
            <div style="display: flex; align-items: center; padding-right: 4px;">
                <button type="submit" class="btn-action list-add-button" style="background: #1e2235; color: #fff; border: 1px solid #3b4260; border-radius: 6px; padding: 0.75rem 1.5rem; cursor: pointer; white-space: nowrap;">
                    Add ✨
                </button>
            </div>
        </form>
    </div>

    <div class="scan-grid list-display-grid" id="words-list-container">
    </div>
</div>
